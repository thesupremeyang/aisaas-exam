<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资源配置中心静态稿</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --line: #e6eaf2;
      --text: #172033;
      --muted: #667085;
      --soft: #8a95a8;
      --blue: #2563eb;
      --green: #13a06f;
      --orange: #e17b21;
      --red: #d92d20;
      --cyan: #0891b2;
      --violet: #7c3aed;
      --shadow: 0 14px 36px rgba(25, 38, 71, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sider {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 16px;
      background: #101828;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 4px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #101828;
      font-weight: 800;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-subtitle {
      color: rgba(255,255,255,0.58);
      font-size: 12px;
      margin-top: 3px;
    }

    .nav-group-title {
      color: rgba(255,255,255,0.46);
      font-size: 12px;
      margin: 8px 8px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      color: rgba(255,255,255,0.78);
      background: transparent;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .nav-button:hover,
    .nav-button.active {
      color: #fff;
      background: rgba(255,255,255,0.11);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .icon {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      flex: none;
      font-size: 13px;
      color: #fff;
    }

    .nav-count {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }

    .main {
      min-width: 0;
      padding: 22px 28px 28px;
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .crumb {
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ghost-btn,
    .primary-btn,
    .icon-btn,
    .plain-btn {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      height: 36px;
      padding: 0 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .primary-btn {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      font-weight: 650;
    }

    .icon-btn {
      width: 36px;
      padding: 0;
    }

    .plain-btn {
      border-color: transparent;
      height: 30px;
      padding: 0 9px;
      color: var(--muted);
      background: transparent;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.7;
      font-size: 14px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #cce8db;
      background: #eefaf5;
      color: #087443;
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 22px;
      line-height: 1;
      font-weight: 760;
    }

    .metric-note {
      margin-top: 8px;
      color: var(--soft);
      font-size: 12px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 330px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .category-panel {
      padding: 12px;
      position: sticky;
      top: 18px;
    }

    .panel-title {
      padding: 5px 6px 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category {
      border: 0;
      border-radius: 8px;
      padding: 9px 10px;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .category.active,
    .category:hover {
      color: var(--blue);
      background: #eef4ff;
    }

    .category span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .category-count {
      color: var(--soft);
      font-size: 12px;
    }

    .list-panel {
      overflow: hidden;
    }

    .toolbar {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 140px 120px auto;
      gap: 10px;
      align-items: center;
    }

    .search {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .search input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
    }

    select {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      padding: 0 10px;
    }

    .resource-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resource-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      cursor: pointer;
    }

    .resource-card:hover,
    .resource-card.active {
      border-color: #9db7ff;
      background: #fbfdff;
    }

    .resource-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-bottom: 7px;
    }

    .resource-name {
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag {
      flex: none;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-soft);
    }

    .tag.ok {
      color: #087443;
      background: #eefaf5;
      border-color: #cce8db;
    }

    .tag.warn {
      color: #a15c07;
      background: #fff6e8;
      border-color: #f7d9a8;
    }

    .tag.danger {
      color: #b42318;
      background: #fff1f0;
      border-color: #fac5c0;
    }

    .resource-desc {
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--soft);
      font-size: 12px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      align-self: start;
    }

    .detail-panel {
      position: sticky;
      top: 18px;
      overflow: hidden;
    }

    .detail-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #f9fbff);
    }

    .detail-kicker {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .detail-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .detail-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .detail-section h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 9px 12px;
      font-size: 13px;
    }

    .info-label {
      color: var(--soft);
    }

    .info-value {
      min-width: 0;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .config-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f172a;
      color: #dbeafe;
      padding: 12px;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.55;
      overflow: auto;
    }

    .danger-zone {
      border: 1px solid #fac5c0;
      background: #fff7f6;
      color: #912018;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 190px minmax(0, 1fr);
      }

      .detail-panel {
        display: none;
      }

      .metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sider {
        position: relative;
        height: auto;
      }

      .main {
        padding: 16px;
      }

      .hero,
      .topbar {
        flex-direction: column;
        align-items: stretch;
        height: auto;
      }

      .metrics,
      .workspace {
        grid-template-columns: 1fr;
      }

      .category-panel {
        position: static;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .resource-card {
        grid-template-columns: 1fr;
      }

      .card-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sider">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="brand-title">星图资源配置中心</div>
          <div class="brand-subtitle">Static Console Mockup</div>
        </div>
      </div>

      <div>
        <div class="nav-group-title">资源类型</div>
        <nav id="resourceNav" class="nav"></nav>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb">控制台 / 智能体平台 / <span id="crumbCurrent">模型托管与配置</span></div>
        <div class="top-actions">
          <button class="ghost-btn" type="button">导入</button>
          <button class="ghost-btn" type="button">导出</button>
          <button id="createButton" class="primary-btn" type="button">+ 新建模型</button>
        </div>
      </header>

      <section class="hero">
        <div>
          <h1 id="pageTitle">模型托管与配置</h1>
          <p id="pageDesc">管理模型供应商、密钥、上下文能力与默认调用策略。</p>
        </div>
        <div id="pageStatus" class="status-pill"><span class="dot"></span> 平台状态正常</div>
      </section>

      <section id="metrics" class="metrics"></section>

      <section class="workspace">
        <aside class="panel category-panel">
          <div class="panel-title">分类导航</div>
          <div id="categories" class="category-list"></div>
        </aside>

        <section class="panel list-panel">
          <div class="toolbar">
            <label class="search">
              <span>⌕</span>
              <input id="searchInput" placeholder="搜索资源名称、标签或描述" />
            </label>
            <select id="typeSelect">
              <option>全部类型</option>
              <option>自定义</option>
              <option>内置</option>
              <option>外部连接</option>
            </select>
            <select id="statusSelect">
              <option>全部状态</option>
              <option>已启用</option>
              <option>已停用</option>
              <option>异常</option>
            </select>
            <button class="icon-btn" type="button" title="切换视图">☷</button>
          </div>

          <div id="resourceList" class="resource-list"></div>
        </section>

        <aside class="panel detail-panel">
          <div class="detail-head">
            <div id="detailKicker" class="detail-kicker">资源详情</div>
            <h2 id="detailTitle">GPT-4.1 mini</h2>
          </div>
          <div class="detail-body">
            <div class="detail-section">
              <h3>基础信息</h3>
              <div id="detailInfo" class="info-grid"></div>
            </div>
            <div class="detail-section">
              <h3>配置摘要</h3>
              <div id="detailConfig" class="config-box"></div>
            </div>
            <div class="detail-section">
              <h3>风险操作</h3>
              <div class="danger-zone">停用或删除资源前，请确认没有生产智能体正在引用。这里保留危险操作区，但默认不突出。</div>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

    let activeKey = 'model';
    let activeItemIndex = 0;

    const nav = document.getElementById('resourceNav');
    const metrics = document.getElementById('metrics');
    const categories = document.getElementById('categories');
    const list = document.getElementById('resourceList');

    function statusClass(status) {
      if (status.includes('异常') || status.includes('需要')) return 'danger';
      if (status.includes('停用') || status.includes('草稿')) return 'warn';
      return 'ok';
    }

    function renderNav() {
      nav.innerHTML = Object.entries(resources).map(([key, page]) => `
        <button class="nav-button ${key === activeKey ? 'active' : ''}" type="button" data-key="${key}">
          <span class="nav-left">
            <span class="icon" style="background:${page.color}">${page.icon}</span>
            <span>${page.nav}</span>
          </span>
          <span class="nav-count">${page.items.length}</span>
        </button>
      `).join('');

      nav.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          activeKey = button.dataset.key;
          activeItemIndex = 0;
          render();
        });
      });
    }

    function renderPage() {
      const page = resources[activeKey];
      document.getElementById('crumbCurrent').textContent = page.title;
      document.getElementById('pageTitle').textContent = page.title;
      document.getElementById('pageDesc').textContent = page.desc;
      document.getElementById('createButton').textContent = page.create;
      document.getElementById('pageStatus').innerHTML = `<span class="dot"></span> ${page.status}`;

      metrics.innerHTML = page.metrics.map(([label, value, note]) => `
        <div class="metric">
          <div class="metric-label">${label}</div>
          <div class="metric-value">${value}</div>
          <div class="metric-note">${note}</div>
        </div>
      `).join('');

      categories.innerHTML = page.categories.map((name, index) => `
        <button class="category ${index === 0 ? 'active' : ''}" type="button">
          <span>${name}</span>
          <span class="category-count">${index === 0 ? page.items.length : ''}</span>
        </button>
      `).join('');

      list.innerHTML = page.items.map((item, index) => `
        <article class="resource-card ${index === activeItemIndex ? 'active' : ''}" data-index="${index}">
          <div>
            <div class="resource-title-row">
              <div class="resource-name">${item[0]}</div>
              <span class="tag">${item[1]}</span>
              <span class="tag ${statusClass(item[2])}">${item[2]}</span>
            </div>
            <div class="resource-desc">${item[3]}</div>
            <div class="meta-row">
              <span>${item[4]}</span>
              <span>${item[5]}</span>
              <span>${item[6]}</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="plain-btn" type="button">测试</button>
            <button class="plain-btn" type="button">编辑</button>
            <button class="icon-btn" type="button">⋯</button>
          </div>
        </article>
      `).join('');

      list.querySelectorAll('.resource-card').forEach((card) => {
        card.addEventListener('click', () => {
          activeItemIndex = Number(card.dataset.index);
          renderPage();
        });
      });

      renderDetail();
    }

    function renderDetail() {
      const page = resources[activeKey];
      const item = page.items[activeItemIndex];
      document.getElementById('detailKicker').textContent = `${page.nav} / ${item[1]}`;
      document.getElementById('detailTitle').textContent = item[0];
      document.getElementById('detailInfo').innerHTML = `
        <div class="info-label">状态</div><div class="info-value"><span class="tag ${statusClass(item[2])}">${item[2]}</span></div>
        <div class="info-label">类型</div><div class="info-value">${item[1]}</div>
        <div class="info-label">引用</div><div class="info-value">${item[4]}</div>
        <div class="info-label">活跃度</div><div class="info-value">${item[5]}</div>
        <div class="info-label">摘要</div><div class="info-value">${item[3]}</div>
      `;
      document.getElementById('detailConfig').textContent = `{
  "resource": "${item[0]}",
  "type": "${item[1]}",
  "status": "${item[2]}",
  "scope": "tenant",
  "updatedAt": "2026-07-09 14:30:00"
}`;
    }

    function render() {
      renderNav();
      renderPage();
    }

    render();
  </script>

# ============================================================
# Apboa 站点配置  ->  放置于 /etc/nginx/conf.d/apboa.conf
# 前端静态目录：/wwwroot/dist-main   (vite base = /web/)
# 后端转发：console :3060  /  runtime :3061  /  websocket :3064
# ============================================================

server {
    listen 80;
    server_name _;

    # 访问根路径 -> 前端页
    location = / {
        return 302 /web/;
    }

    # 前端静态资源（base=/web/）
    location /web/ {
        alias /wwwroot/dist-main/;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    # ---- WebSocket 推送：/api/ws/apboa -> :3064/ws/apboa ----
    location /api/ws/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3064;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- WebSocket push: /web/api/ws/apboa -> :3064/ws/apboa ----
    # The frontend base path is /web/, so this route must be more specific
    # than the generic /web/api/ console proxy below.
    location /web/api/ws/ {
        rewrite ^/web/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3064;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- AGUI 流式：/web/api/runtime -> :3061/runtime ----
    location /web/api/runtime/ {
        proxy_pass http://127.0.0.1:3061/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 通用 API：/web/api -> :3060/api ----
    location /web/api/ {
        proxy_pass http://127.0.0.1:3060/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传大小与后端 max-file-size(30MB)/max-request-size(100MB) 对齐
    client_max_body_size 100m;
}


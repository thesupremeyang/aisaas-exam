# ============================================================
# Docker 环境配置（spring.profiles.active=docker）
# 所有值均从环境变量读取，由 docker-compose 注入
# ============================================================

server:
  port: 3061
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

# SSE 执行线程池（有界 + 快速失败，超过容量返回「系统繁忙」而不是无限建线程）
apboa:
  agui:
    run-threads-core: ${AGUI_RUN_THREADS_CORE:32}
    run-threads-max: ${AGUI_RUN_THREADS_MAX:256}
    run-queue-capacity: ${AGUI_RUN_QUEUE_CAPACITY:128}
    run-timeout-ms: ${AGUI_RUN_TIMEOUT_MS:120000}
  agent:
    reconcile:
      initial-delay-ms: ${AGENT_RECONCILE_INITIAL_DELAY_MS:60000}
      interval-ms: ${AGENT_RECONCILE_INTERVAL_MS:120000}

agentscope:
  agui:
    path-prefix: /runtime/agui
    cors-enabled: true
    enable-reasoning: true
    server-side-memory: true
    max-thread-sessions: 1000

spring:
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: sched-
  data:
    redis:
      host: ${REDIS_HOST:apboa-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}
      database: ${REDIS_DATABASE:7}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: 0
          max-wait: ${REDIS_POOL_MAX_WAIT:200ms}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:apboa-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:apboa_next}?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=60000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: ${DB_POOL_MAX_ACTIVE:20}
      max-wait: ${DB_POOL_MAX_WAIT:5000}
      validation-query: SELECT 1
      validation-query-timeout: 5
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_YOUR_JWT_SECRET}

# shell-proxy 远程命令执行代理配置
shell-proxy:
  enabled: ${SHELL_PROXY_ENABLED:true}
  base-url: http://${PROXY_HOST:apboa-proxy}:${PROXY_PORT:3062}

# WebSocket 配置
websocket:
  enabled: ${WEBSOCKET_ENABLED:true}
  base-url: http://${WEBSOCKET_HOST:apboa-websocket}:${WEBSOCKET_PORT:3064}

# RAG 相关配置
rag:
  store: ${VECTOR_STORE_TYPE:pgvector}
  pgvector:
    url: jdbc:postgresql://${PG_HOST:apboa-pgvector}:${PG_PORT:5432}/${PG_DATABASE:apboa_vector}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  milvus:
    host: ${MILVUS_HOST:milvus}
    port: ${MILVUS_PORT:19530}
    username:
    password:
    token:
    database: ${MILVUS_DATABASE:default}
  qdrant:
    host: ${QDRANT_HOST:qdrant}
    port: ${QDRANT_PORT:6334}
    api-key:
    collection-prefix: apboa_rag
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://apboa-elasticsearch:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    api-key: ${ELASTICSEARCH_API_KEY:}
    index-prefix: ${ELASTICSEARCH_INDEX_PREFIX:apboa_rag}
    connect-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:5000}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:60000}
  weaviate:
    host: ${WEAVIATE_HOST:weaviate}
    port: ${WEAVIATE_PORT:8080}
    scheme: ${WEAVIATE_SCHEME:http}
    api-key: ${WEAVIATE_API_KEY:}
    class-prefix: ${WEAVIATE_CLASS_PREFIX:ApboaRag}

mybatis-plus:
  mapper-locations: classpath*:com/hxh/apboa/**/mapper/**/*.xml
  type-aliases-package: com.hxh.apboa.**.entity
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
      insert-strategy: not_null
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

# 心跳上报配置
heartbeat:
  enabled: true
  console-url: http://${CONSOLE_HOST:apboa-console}:3060
  service-type: RUNTIME
  port: ${server.port}
